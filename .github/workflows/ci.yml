name: Frontend CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OneHookClient
        uses: actions/checkout@v4
        with:
          path: OneHookClient

      - name: Checkout OneHookBackend
        uses: actions/checkout@v4
        with:
          repository: pushpsood/OneHookBackend
          token: ${{ secrets.GITHUB_TOKEN }}
          path: OneHookBackend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: OneHookClient/package-lock.json

      - name: Setup Java (for Smithy SDK generation)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Generate API SDK
        working-directory: OneHookBackend
        run: |
          npm ci
          npm run generate

      - name: Install Frontend Dependencies
        working-directory: OneHookClient
        run: npm ci

      - name: Lint
        working-directory: OneHookClient
        run: npm run lint

      - name: Test
        working-directory: OneHookClient
        run: npm test
