name: Frontend CI

on:
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OneHookClient
        uses: actions/checkout@v4
        with:
          path: OneHookClient



      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: OneHookClient/package-lock.json



      - name: Install Frontend Dependencies
        working-directory: OneHookClient
        run: npm ci

      - name: Lint
        working-directory: OneHookClient
        run: npm run lint

      - name: Test
        working-directory: OneHookClient
        run: npm test
