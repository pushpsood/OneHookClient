name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'infra/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for requesting the JWT
      contents: read  # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Debug JWT Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = token.split('.')[1];
            const decoded = Buffer.from(payload, 'base64').toString('utf8');
            console.log('JWT Claims:', JSON.parse(decoded));

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - run: npm ci
      - run: npm run build:prod

      - name: Deploy frontend stack
        run: |
          set -euo pipefail

          DEPLOY_ARGS=(
            --context env=prod
            --app 'npx tsx infra/stacks/frontend-app.ts'
            --require-approval never
          )

          if [ -n "${{ secrets.FRONTEND_DOMAIN }}" ]; then
            DEPLOY_ARGS+=(--context "domain=${{ secrets.FRONTEND_DOMAIN }}")
          fi

          npx cdk deploy --all "${DEPLOY_ARGS[@]}"
