name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'infra/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
  workflow_dispatch:

jobs:
  # Mandatory gate: no deployment happens unless type-checking and the test suite pass on the
  # exact commit being deployed. This runs as a SEPARATE job so that a failing build never even
  # reaches the AWS credential step — a red build cannot assume the deploy role.
  #
  # It is intentionally duplicated here rather than relying on the pull_request CI workflow:
  # `push` and `pull_request` are independent triggers, so PR checks do not gate a direct push to
  # main or a manual `workflow_dispatch` run. See "No Test Code in Production" in README.md.
  verify:
    name: Lint & Test (deployment gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

  deploy:
    name: Build & Deploy
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for requesting the JWT
      contents: read  # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - run: npm ci
      - run: npm run build:prod

      - name: Deploy frontend stack
        run: |
          set -euo pipefail

          DEPLOY_ARGS=(
            --context env=prod
            --app 'npx tsx infra/stacks/frontend-app.ts'
            --require-approval never
          )

          if [ -n "${{ secrets.FRONTEND_DOMAIN }}" ]; then
            DEPLOY_ARGS+=(--context "domain=${{ secrets.FRONTEND_DOMAIN }}")
          fi

          npx cdk deploy --all "${DEPLOY_ARGS[@]}"
