    <meta name="twitter:image" content="https://onehook.club/media/onehook_white_inside-512.png" />
    <meta name="twitter:image:alt" content="OneHook logo: a silver heart with a navy 1 inside, on a white background." />
    <link rel="icon" type="image/png" sizes="180x180" href="/media/onehook_white_inside-180.png" />
    <link rel="shortcut icon" type="image/png" sizes="180x180" href="/media/onehook_white_inside-180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preload" as="image" href="/media/LogoHeart.png" />

    <title>OneHook — Intentional Messaging App for One Real Connection</title>

    <!-- Structured data: Organization, WebSite, the OneHook app, and FAQ. Keep factual to the
         product (see README): one match at a time, end-to-end encrypted conversations. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://onehook.club/#organization",
            "name": "OneHook",
            "url": "https://onehook.club/",
            "logo": "https://onehook.club/media/onehook_white_inside-512.png",
            "description": "OneHook is an intentional dating app for one meaningful connection at a time, with private, end-to-end encrypted conversations.",
            "sameAs": [
              "https://instagram.com/onehook.club",
              "https://facebook.com/onehook.club",
              "https://x.com/onehookclub",
              "https://threads.net/@onehook.club",
              "https://www.youtube.com/@onehookclub",
              "https://www.linkedin.com/company/onehook/"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://onehook.club/#website",
            "url": "https://onehook.club/",
            "name": "OneHook",
            "description": "Intentional dating app for one meaningful connection at a time.",
            "inLanguage": "en",
            "publisher": { "@id": "https://onehook.club/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "OneHook",
            "operatingSystem": "iOS, Android",
            "applicationCategory": "SocialNetworkingApplication",
            "url": "https://onehook.club/",
            "image": "https://onehook.club/media/onehook_white_inside-512.png",
            "description": "OneHook is a private, intentional dating app. Focus on one match at a time and build a real relationship through end-to-end encrypted conversations instead of endless swiping.",
            "publisher": { "@id": "https://onehook.club/#organization" },
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What is OneHook?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "OneHook is an intentional dating app that lets you focus on one match at a time until you build a real connection or decide to unmatch, instead of endlessly swiping."
                }
              },
              {
                "@type": "Question",
                "name": "How is OneHook different from other dating apps?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Instead of a feed of endless swipes and dozens of open chats, OneHook gives you one connection at a time, so both people actually show up and invest in a real conversation."
                }
              },
              {
                "@type": "Question",
                "name": "Is OneHook private and secure?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Messages between matches are end-to-end encrypted, so your conversations stay between the two of you — not even OneHook can read them."
                }
              },
              {
                "@type": "Question",
                "name": "Is OneHook free?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You can start dating on OneHook for free, with optional Super and Infinity memberships that unlock more ways to connect."
                }
              }
            ]
          }
        ]
      }
    </script>

    <!-- Instant, self-contained splash to avoid any flash of unstyled content
         before the app bundle + stylesheet are applied. Removed by main.tsx once
         the app has painted. -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fdfdfd;
        transition: opacity 0.4s ease;
      }
      #app-splash.app-splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* OneHook heart loader: the silver heart flips around the Y axis in 3D
         while the navy "1" stays fixed on top (matches the iOS HeartLoaderView). */
      #app-splash .oh-loader {
        position: relative;
        width: 124px;
        height: 124px;
        perspective: 600px;
      }
      #app-splash .oh-loader img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #app-splash .oh-heart {
        transform-origin: 50% 50%;
        animation: oh-flip 1.8s ease-in-out infinite;
      }
      #app-splash .oh-one {
        z-index: 2;
      }
      @keyframes oh-flip {
        from { transform: rotateY(0deg); }
        to { transform: rotateY(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .oh-heart { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="oh-loader">
        <img class="oh-heart" src="/media/LogoHeart.png" alt="" />
        <img class="oh-one" src="/media/LogoOne.png" alt="" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
