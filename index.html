<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="description" content="OneHook is a private, intentional dating app: one meaningful match at a time. No endless swiping or ghosting, just real, end-to-end encrypted conversations." />
    <meta name="keywords" content="dating app, intentional dating, serious dating, one match at a time, meaningful connection, private messaging, end-to-end encrypted chat, secure dating app, online dating, relationships, couples, anti-swiping dating app" />
    <meta name="author" content="OneHook" />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <meta name="theme-color" content="#FDFDFD" />
    <!-- Homepage values. Every public page also gets its own pre-built copy of this file at build time
         (dist/<route>/index.html) with its own title, description, canonical and og:url — see
         src/config/seo-routes.ts and the prerender plugin in vite.config.ts. -->
    <link rel="canonical" href="https://onehook.club/" />
    <meta name="application-name" content="OneHook" />
    <meta name="apple-mobile-web-app-title" content="OneHook" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OneHook" />
    <meta property="og:url" content="https://onehook.club/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="OneHook — Intentional Dating App for One Real Connection" />
    <meta property="og:description" content="OneHook is a private, intentional dating app: one meaningful match at a time. No endless swiping or ghosting, just real, end-to-end encrypted conversations." />
    <meta property="og:image" content="https://onehook.club/media/og/onehook-og.png" />
    <meta property="og:image:secure_url" content="https://onehook.club/media/og/onehook-og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OneHook: the intentional dating app for one real connection at a time." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@onehookclub" />
    <meta name="twitter:creator" content="@onehookclub" />
    <meta name="twitter:title" content="OneHook — Intentional Dating App for One Real Connection" />
    <meta name="twitter:description" content="OneHook is a private, intentional dating app: one meaningful match at a time. No endless swiping or ghosting, just real, end-to-end encrypted conversations." />
    <meta name="twitter:image" content="https://onehook.club/media/og/onehook-og.png" />
    <meta name="twitter:image:alt" content="OneHook: the intentional dating app for one real connection at a time." />
    <link rel="icon" type="image/png" sizes="180x180" href="/media/onehook_white_inside-180.png" />
    <link rel="shortcut icon" type="image/png" sizes="180x180" href="/media/onehook_white_inside-180.png" />
    <link rel="apple-touch-icon" href="/media/onehook_white_inside-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/media/LogoHeart.png" />
    <link rel="preload" as="image" href="/media/LogoOne.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,900;1,900&family=JetBrains+Mono&display=swap"
    />
    <title>OneHook — Intentional Dating App for One Real Connection</title>

    <!-- Site-wide structured data: Organization and WebSite. Page-specific data (e.g. the app's
         SoftwareApplication on the homepage) comes from src/config/seo-routes.ts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://onehook.club/#organization",
            "name": "OneHook",
            "url": "https://onehook.club/",
            "logo": "https://onehook.club/media/onehook_white_inside-512.png",
            "description": "OneHook is an intentional dating app for one meaningful connection at a time, with private, end-to-end encrypted conversations.",
            "sameAs": [
              "https://instagram.com/onehook.club",
              "https://facebook.com/onehook.club",
              "https://x.com/onehookclub",
              "https://threads.net/@onehook.club",
              "https://www.youtube.com/@onehookclub",
              "https://www.linkedin.com/company/onehook/"
            ],
            "parentOrganization": {
              "@type": "Organization",
              "@id": "https://sahaequation.com/#organization",
              "name": "Saha Equation Technologies (OPC) Private Limited",
              "url": "https://sahaequation.com"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://onehook.club/#website",
            "url": "https://onehook.club/",
            "name": "OneHook",
            "description": "Intentional dating app for one meaningful connection at a time.",
            "inLanguage": "en",
            "publisher": { "@id": "https://onehook.club/#organization" }
          }
        ]
      }
    </script>

    <!-- Instant, self-contained splash to avoid any flash of unstyled content
         before the app bundle + stylesheet are applied. Removed by main.tsx once
         the app has painted. -->
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fdfdfd;
        transition: opacity 0.4s ease;
      }
      #app-splash.app-splash--hidden {
        opacity: 0;
        pointer-events: none;
      }
      /* OneHook heart loader: the silver heart flips around the Y axis in 3D
         while the navy "1" stays fixed on top (matches the iOS HeartLoaderView). */
      #app-splash .oh-loader {
        position: relative;
        width: 124px;
        height: 124px;
        perspective: 600px;
      }
      #app-splash .oh-loader img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #app-splash .oh-heart {
        transform-origin: 50% 50%;
        animation: oh-flip 1.8s ease-in-out infinite;
      }
      #app-splash .oh-one {
        z-index: 2;
      }
      @keyframes oh-flip {
        from { transform: rotateY(0deg); }
        to { transform: rotateY(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .oh-heart { animation: none; }
      }
    </style>
    <!-- Without JavaScript the splash is never dismissed; hide it so the pre-rendered page shows. -->
    <noscript><style>#app-splash { display: none; }</style></noscript>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="oh-loader">
        <img class="oh-heart" src="/media/LogoHeart.png" alt="" />
        <img class="oh-one" src="/media/LogoOne.png" alt="" />
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
