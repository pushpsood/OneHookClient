version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - node --version
      - npm --version
      - npm ci
  build:
    commands:
      - echo "Verifying commit ${SOURCE_COMMIT}"
      - npm run lint
      - npm test
      # HARD GATE: every interaction reported with a backend-controlled id (prints TELEMETRY_CONTRACT.txt).
      - npm run telemetry:contract

cache:
  paths:
    - '/root/.npm/**/*'
